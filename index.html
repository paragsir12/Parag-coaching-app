<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Loyalty System</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 20px;
      margin: 40px auto;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px;
      margin-top: 10px;
      width: 100%;
      background: black;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .stamp {
      display: inline-block;
      width: 30px;
      height: 30px;
      margin: 5px;
      border-radius: 50%;
      background: lightgray;
    }
    .active {
      background: green;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Scan & Get Reward</h2>

  <p>⭐ Give us a review</p>
  <a href="https://g.page/r/YOUR_GOOGLE_REVIEW_LINK" target="_blank">
    <button>Leave Review</button>
  </a>

  <h3>Your Visits</h3>
  <div id="stamps"></div>

  <button onclick="addStamp()">Scan QR (Demo)</button>

  <p id="reward"></p>

  <hr>

  <h4>Follow Us</h4>
  <a href="#">Instagram</a> |
  <a href="#">Facebook</a>
</div>

<script>
  let stamps = 0;
  const maxStamps = 10;

  function renderStamps() {
    const container = document.getElementById("stamps");
    container.innerHTML = "";

    for (let i = 0; i < maxStamps; i++) {
      const div = document.createElement("div");
      div.classList.add("stamp");
      if (i < stamps) div.classList.add("active");
      container.appendChild(div);
    }
  }

  function addStamp() {
    if (stamps < maxStamps) {
      stamps++;
      renderStamps();
    }

    if (stamps === maxStamps) {
      document.getElementById("reward").innerText = "🎉 You got a FREE reward!";
    }
  }

  renderStamps();
</script>

</body>
</html>
